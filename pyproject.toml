[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-bridge"
dynamic = ["version"]
description = "Telegram receipt intake for Duet Ledger"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.12,<3", "Pillow>=12,<13", "numpy>=2.3,<3", "opencv-python-headless>=4.12,<5"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "ruff>=0.14,<1"]

[project.scripts]
receipt-bridge = "receipt_bridge.main:main"

[tool.setuptools.packages.find]
include = ["receipt_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
receipt_bridge = ["static/*"]

[tool.setuptools.dynamic]
version = {attr = "receipt_bridge.__version__"}
