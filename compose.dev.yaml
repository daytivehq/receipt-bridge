# Development: separate project, data, bot credentials and ledger network.
name: receipt-bridge-dev
services:
  receipt-bridge:
    container_name: receipt-bridge-dev
    image: receipt-bridge:dev
    pull_policy: build
    build:
      context: .
      target: runtime
    restart: unless-stopped
    init: true
    env_file: .env.dev
    ports:
      - "${RECEIPT_BRIDGE_DEV_BIND:-127.0.0.1}:${RECEIPT_BRIDGE_DEV_PORT:-18089}:8092"
    volumes:
      - ./config.dev.toml:/app/config.toml:ro
      - receipt-bridge-dev-data:/data
    networks:
      - default
      - ledger-dev
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    pids_limit: 256
    stop_grace_period: 5m
networks:
  ledger-dev:
    external: true
    name: ${RECEIPT_BRIDGE_DEV_LEDGER_NETWORK:-duet-ledger-dev_default}
volumes:
  receipt-bridge-dev-data:
    name: receipt-bridge-dev-data
