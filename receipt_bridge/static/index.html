<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Receipt Bridge · 운영 관리</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/style.css" />
    <script src="/settings.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <section id="login" class="login-screen" hidden>
      <div class="login-card">
        <div class="brand-mark" aria-hidden="true">rb</div>
        <span class="eyebrow">RECEIPT BRIDGE</span>
        <h1 id="login-heading">영수증을 기록으로.</h1>
        <p id="login-description">서비스 현황과 설정을 한곳에서 관리하세요.</p>
        <form id="login-form">
          <label for="password">관리 비밀번호</label
          ><input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="관리 비밀번호"
          />
          <div id="password-confirm-row" hidden>
            <label for="password-confirm">비밀번호 확인</label>
            <input
              id="password-confirm"
              type="password"
              autocomplete="new-password"
              placeholder="비밀번호를 한 번 더 입력하세요"
            />
          </div>
          <button class="primary" type="submit">
            운영 화면 열기 <span aria-hidden="true">↗</span>
          </button>
          <p id="login-error" role="alert"></p>
        </form>
        <small>가계부 로그인과 별도로 사용하는 관리 화면입니다.</small>
      </div>
    </section>
    <div id="app" hidden>
      <aside class="sidebar">
        <a class="brand" href="/dashboard"
          ><span class="brand-mark">rb</span
          ><span>Receipt Bridge<small>영수증 연결 서비스</small></span></a
        >
        <div class="nav-label">WORKSPACE</div>
        <nav aria-label="주 메뉴">
          <button data-page="dashboard">대시보드</button
          ><button data-page="jobs">작업 내역</button
          ><button data-page="logs">로그 조회</button
          ><button data-page="settings">서비스 설정</button>
        </nav>
        <div class="sidebar-note">
          <button id="dismiss-sidebar-note" class="icon-btn sidebar-note-close" type="button" aria-label="안내 박스 닫기" title="안내 박스 닫기">×</button>
          <span class="small-icon">↗</span
          ><strong>사진 한 장에서, 가계부까지</strong>
          <p>영수증 확인과 저장은<br />텔레그램에서 이어집니다.</p>
          <span class="soft-tag">Docker · Long polling</span>
        </div>
        <div class="sidebar-bottom">
          <span class="avatar">관</span
          ><span
            ><strong>서비스 관리자</strong><small>홈서버 운영 공간</small></span
          ><button
            id="logout"
            class="icon-btn"
            title="로그아웃"
            aria-label="로그아웃"
          >
            ↪
          </button>
        </div>
      </aside>
      <div class="main-shell">
        <header class="topbar">
          <span class="breadcrumb"
            >워크스페이스 <span>/</span>
            <strong id="breadcrumb">대시보드</strong></span
          >
          <div class="topbar-actions">
            <span id="top-status" class="badge">불러오는 중</span
            ><button
              id="refresh"
              class="icon-btn"
              title="새로고침"
              aria-label="새로고침"
            >
              ↻
            </button>
          </div>
        </header>
        <main id="content" tabindex="-1"></main>
        <footer>
          <span>사진 한 장에서, 가계부까지.</span>
          <span class="footer-version">Receipt Bridge <span>·</span> __APP_VERSION__</span>
        </footer>
      </div>
    </div>
    <div id="toast" role="status" hidden></div>
    <dialog id="detail">
      <div class="dialog-heading">
        <h2>작업 상세</h2>
        <button id="close-detail" class="icon-btn" aria-label="닫기">✕</button>
      </div>
      <div id="detail-body"></div>
    </dialog>
  </body>
</html>
