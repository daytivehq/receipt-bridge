# Receipt Bridge 0.2.0+. Change AI providers and models in the web UI.
name: receipt-bridge
services:
  receipt-bridge:
    container_name: receipt-bridge
    image: ghcr.io/daytivehq/receipt-bridge:latest
    restart: unless-stopped
    ports:
      - "8892:8092"
    environment:
      AI_RUNNER_AUTH_DIR: /runner-auth
    volumes:
      - receipt-data:/data
      - runner-auth:/runner-auth
    mem_limit: 2g

  ai-runner:
    image: ghcr.io/daytivehq/receipt-bridge-ai-runner:latest
    restart: unless-stopped
    init: true
    environment:
      AI_RUNNER_AUTH_DIR: /runner-auth
    volumes:
      - runner-auth:/runner-auth:ro
      - ai-home:/ai-home
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    stop_grace_period: 5m

volumes:
  receipt-data:
  runner-auth:
  ai-home:
